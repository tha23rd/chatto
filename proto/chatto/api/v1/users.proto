syntax = "proto3";

package chatto.api.v1;

import "chatto/api/v1/presence.proto";
import "chatto/api/v1/user_status.proto";

// Public user fields.
message User {
  // Stable user ID.
  string id = 1;
  // Login name.
  string login = 2;
  // Display name, when set.
  string display_name = 3;
  // True when the user account has been deleted.
  bool deleted = 4;
  // Avatar image URL, when available.
  optional string avatar_url = 5;
  // Current live presence status.
  PresenceStatus presence_status = 6;
  // Custom profile status, when set.
  CustomUserStatus custom_status = 7;
  // Account kind. When automated (e.g. a channel webhook identity), clients
  // may render an "automated" marker. Empty/unspecified means a human account.
  UserKind kind = 8;
}

// UserKind discriminates human accounts from synthetic, non-human identities
// such as channel webhook authors (FDR-032).
enum UserKind {
  USER_KIND_UNSPECIFIED = 0;
  USER_KIND_HUMAN = 1;
  USER_KIND_WEBHOOK = 2;
}
