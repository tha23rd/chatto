[package]
name = "chatto-desktop"
version = "0.1.0"
description = "Resource-efficient Windows client for Chatto"
authors = ["Chatto contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/tha23rd/chatto"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chatto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-http = "2.5.9"
tauri-plugin-websocket = "2.4.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
url = "2.5.8"
