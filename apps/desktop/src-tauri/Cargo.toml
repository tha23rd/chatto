[package]
name = "chatto-desktop"
version = "0.1.0"
description = "Resource-efficient Windows client for Chatto"
authors = ["Chatto contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/tha23rd/chatto"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chatto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.33"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-http = { version = "2.5.9", default-features = false, features = ["charset", "cookies", "http2", "rustls-tls-native-roots"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-websocket = { version = "2.4.2", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1.53.0", features = ["macros", "net", "time", "io-util"] }
url = "2.5.8"
